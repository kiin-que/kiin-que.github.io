name: Build and deploy Astro

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Install, build, verify, and upload
        uses: withastro/action@v6
        env:
          # Content comes from Drive's archive/publish through the Apps Script web app (apps-script/).
          PUBLISH_URL: ${{ secrets.PUBLISH_URL }}
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
        with:
          node-version: 24
          package-manager: pnpm@11.25.0
          build-cmd: pnpm run build && pnpm run verify

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
